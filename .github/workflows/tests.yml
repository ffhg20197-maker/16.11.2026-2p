name: CMS Shield checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/audit_permissions.sh scripts/backup.sh
      - run: python -m py_compile scripts/fim.py
